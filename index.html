<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propellic · Editorial Calendar Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* ── Brand Tokens ─────────────────────────────────── */
    :root {
      --midnight:       #152534;
      --midnight-light: #1e3347;
      --midnight-mid:   #2a4560;
      --midnight-faint: #3b5f7a;
      --pink:           #E21A6B;
      --pink-hover:     #c4185c;
      --pink-light:     #EB669C;
      --pink-pale:      #F7BFD5;
      --white:          #ffffff;
      --off-white:      #f0f4f7;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted:     rgba(255,255,255,0.4);
      --border:         rgba(255,255,255,0.12);
      --border-strong:  rgba(255,255,255,0.22);

      /* Semantic */
      --green:    #10B981;
      --amber:    #F59E0B;
      --blue:     #3B82F6;
      --purple:   #8B5CF6;
      --red:      #EF4444;
      --teal:     #06B6D4;

      --radius-sm: 6px;
      --radius:    10px;
      --radius-lg: 16px;
      --shadow:    0 8px 32px rgba(0,0,0,0.4);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* ── Reset ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background: var(--midnight);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: var(--pink-light); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    input, select, textarea { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

    /* ── Header ───────────────────────────────────────── */
    .app-header {
      background: rgba(21,37,52,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--pink);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
    }
    .logo-sub {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .header-client {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ── Progress Steps ───────────────────────────────── */
    .progress-bar {
      background: var(--midnight-light);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: 52px;
    }
    .progress-step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      padding: 0 1.5rem;
      position: relative;
    }
    .progress-step.active { color: var(--white); }
    .progress-step.done { color: var(--pink-light); }
    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--midnight-mid);
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.25s;
    }
    .progress-step.active .step-num {
      background: var(--pink);
      border-color: var(--pink);
    }
    .progress-step.done .step-num {
      background: var(--pink-light);
      border-color: var(--pink-light);
    }
    .step-arrow {
      color: var(--midnight-faint);
      font-size: 1rem;
      padding: 0 0.5rem;
    }

    /* ── Main Content ─────────────────────────────────── */
    .page-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }
    .page-content.wide {
      max-width: 100%;
      padding: 1.5rem 1.5rem;
    }
    .page-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }
    .page-sub {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    .eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.5rem;
    }

    /* ── Cards ────────────────────────────────────────── */
    .card {
      background: var(--midnight-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .card-title-icon {
      width: 28px;
      height: 28px;
      background: rgba(226,26,107,0.15);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    /* ── Form Elements ────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.5rem;
    }
    .form-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem 1.5rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }
    label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    label .req { color: var(--pink); }
    .form-input, .form-select {
      background: var(--midnight);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--white);
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: border-color 0.2s;
      width: 100%;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--pink);
      outline: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-select option { background: var(--midnight-light); }

    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--pink);
      color: var(--white);
    }
    .btn-primary:hover { background: var(--pink-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--white);
      border: 1.5px solid var(--border-strong);
    }
    .btn-secondary:hover { border-color: var(--pink-light); color: var(--pink-light); }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      padding: 0.5rem 0.75rem;
    }
    .btn-ghost:hover { color: var(--white); background: rgba(255,255,255,0.06); }
    .btn-danger {
      background: transparent;
      color: var(--red);
      padding: 0.35rem 0.6rem;
      border-radius: 5px;
      font-size: 0.8rem;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.12); }
    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }

    /* ── Upload Zones ─────────────────────────────────── */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .upload-zone {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--pink);
      background: rgba(226,26,107,0.05);
    }
    .upload-zone.loaded {
      border-style: solid;
      border-color: var(--green);
      background: rgba(16,185,129,0.06);
    }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      font-size: 0;
    }
    .upload-icon { font-size: 1.6rem; margin-bottom: 0.5rem; }
    .upload-title {
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .upload-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .upload-filename {
      font-size: 0.72rem;
      color: var(--green);
      font-weight: 600;
      margin-top: 0.4rem;
    }
    .upload-optional {
      grid-column: 1 / -1;
    }
    .upload-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 5px;
      vertical-align: middle;
    }
    .badge-optional {
      background: rgba(255,255,255,0.08);
      color: var(--text-muted);
    }
    .badge-required {
      background: rgba(226,26,107,0.15);
      color: var(--pink);
    }

    /* ── Demo Banner ──────────────────────────────────── */
    .demo-banner {
      background: rgba(226,26,107,0.1);
      border: 1px solid rgba(226,26,107,0.3);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .demo-banner p { font-size: 0.82rem; color: var(--text-secondary); }
    .demo-banner strong { color: var(--white); }

    /* ── Calendar Toolbar ─────────────────────────────── */
    .cal-toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.5rem;
      background: var(--midnight-light);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .cal-toolbar .left { display: flex; align-items: center; gap: 0.75rem; flex: 1; }
    .cal-toolbar .right { display: flex; align-items: center; gap: 0.75rem; }
    .cal-filter-select {
      background: var(--midnight);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--white);
      padding: 0.4rem 0.75rem;
      font-size: 0.76rem;
      font-family: inherit;
      font-weight: 500;
    }
    .cal-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── Table ────────────────────────────────────────── */
    .table-scroll-wrapper {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 230px);
    }
    .cal-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.78rem;
      min-width: 2200px;
    }
    .cal-table thead th {
      background: #0f1e2e;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.6rem 0.75rem;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .cal-table thead th:first-child {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #0f1e2e;
    }
    .cal-table tbody tr {
      transition: background 0.15s;
    }
    .cal-table tbody tr:hover { background: rgba(255,255,255,0.03); }
    .cal-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
    .cal-table tbody tr:nth-child(even):hover { background: rgba(255,255,255,0.04); }
    .cal-table td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      vertical-align: middle;
    }
    .cal-table td:first-child {
      position: sticky;
      left: 0;
      background: var(--midnight);
      z-index: 1;
    }
    .cal-table tbody tr:nth-child(even) td:first-child {
      background: #12202f;
    }

    /* Column widths */
    .col-priority      { width: 55px;  min-width: 55px; text-align: center; }
    .col-month         { width: 100px; min-width: 100px; }
    .col-type          { width: 130px; min-width: 130px; }
    .col-status        { width: 155px; min-width: 155px; }
    .col-url           { width: 140px; min-width: 140px; }
    .col-funnel        { width: 115px; min-width: 115px; }
    .col-topic         { width: 210px; min-width: 210px; }
    .col-kw            { width: 155px; min-width: 155px; }
    .col-kd            { width: 60px;  min-width: 60px;  text-align: center; }
    .col-volume        { width: 75px;  min-width: 75px;  text-align: right; }
    .col-position      { width: 72px;  min-width: 72px;  text-align: center; }
    .col-pain          { width: 155px; min-width: 155px; }
    .col-tp            { width: 80px;  min-width: 80px;  text-align: right; }
    .col-growth        { width: 75px;  min-width: 75px;  text-align: right; }
    .col-forecast      { width: 80px;  min-width: 80px;  text-align: right; }
    .col-deliverable   { width: 160px; min-width: 160px; }
    .col-rationale     { width: 220px; min-width: 220px; }
    .col-notes         { width: 200px; min-width: 200px; }
    .col-actions       { width: 42px;  min-width: 42px;  text-align: center; }

    /* Priority number */
    .priority-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(226,26,107,0.15);
      color: var(--pink-light);
      font-weight: 700;
      font-size: 0.75rem;
    }

    /* Editable cells */
    .editable {
      display: block;
      width: 100%;
      padding: 0.3rem 0.4rem;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: text;
      line-height: 1.4;
      min-height: 1.8em;
      word-break: break-word;
      transition: border-color 0.15s;
    }
    .editable:hover { border-color: var(--border); background: rgba(255,255,255,0.03); }
    .editable:focus {
      border-color: var(--pink);
      background: rgba(226,26,107,0.06);
      outline: none;
    }
    /* Placeholder for empty editable spans */
    .editable:empty::before {
      content: attr(data-placeholder);
      color: var(--text-muted);
      font-style: italic;
    }

    /* Inline select */
    .cell-select {
      background: transparent;
      border: 1px solid transparent;
      color: var(--white);
      font-size: 0.76rem;
      font-family: inherit;
      font-weight: 500;
      padding: 0.25rem 0.35rem;
      border-radius: 4px;
      width: 100%;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cell-select:hover { border-color: var(--border); }
    .cell-select:focus { border-color: var(--pink); outline: none; }
    .cell-select option { background: var(--midnight-light); }

    /* URL cell */
    .url-cell { font-size: 0.7rem; color: var(--pink-light); }
    .url-new {
      display: inline-block;
      background: rgba(226,26,107,0.15);
      color: var(--pink);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    /* ── Status Badges ────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .s-proposed   { background: rgba(59,130,246,0.15);  color: #60A5FA; }
    .s-approved   { background: rgba(6,182,212,0.15);   color: #22D3EE; }
    .s-rejected   { background: rgba(239,68,68,0.15);   color: #F87171; }
    .s-outline    { background: rgba(245,158,11,0.15);  color: #FCD34D; }
    .s-writing    { background: rgba(251,146,60,0.15);  color: #FB923C; }
    .s-review     { background: rgba(139,92,246,0.15);  color: #A78BFA; }
    .s-published  { background: rgba(16,185,129,0.15);  color: #34D399; }

    /* ── Funnel Badges ────────────────────────────────── */
    .funnel-badge {
      display: inline-flex;
      flex-direction: column;
      gap: 1px;
    }
    .funnel-stage {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .funnel-sub {
      font-size: 0.6rem;
      color: var(--text-muted);
      padding-left: 2px;
    }
    .f-tofu  { background: rgba(139,92,246,0.18);  color: #A78BFA; }
    .f-mofu  { background: rgba(59,130,246,0.18);  color: #60A5FA; }
    .f-bofu  { background: rgba(16,185,129,0.18);  color: #34D399; }

    /* ── Content Type Badges ──────────────────────────── */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.66rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid;
      white-space: nowrap;
    }
    .t-outline { border-color: rgba(59,130,246,0.4);  color: #60A5FA;  background: rgba(59,130,246,0.08); }
    .t-refresh { border-color: rgba(245,158,11,0.4);  color: #FCD34D;  background: rgba(245,158,11,0.08); }
    .t-ai      { border-color: rgba(139,92,246,0.4);  color: #A78BFA;  background: rgba(139,92,246,0.08); }

    /* ── Rationale Tags ───────────────────────────────── */
    .rationale-tag {
      display: inline-block;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 2px 5px;
      border-radius: 3px;
      margin-right: 4px;
      margin-bottom: 3px;
      vertical-align: middle;
    }
    .r-seasonality { background: rgba(245,158,11,0.2);  color: #FCD34D; }
    .r-metric      { background: rgba(59,130,246,0.2);  color: #60A5FA; }
    .r-strategy    { background: rgba(226,26,107,0.2);  color: var(--pink-light); }

    /* ── KD / Volume chips ────────────────────────────── */
    .kd-chip {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.72rem;
    }
    .kd-low  { background: rgba(16,185,129,0.15); color: #34D399; }
    .kd-mid  { background: rgba(245,158,11,0.15); color: #FCD34D; }
    .kd-high { background: rgba(239,68,68,0.15);  color: #F87171; }

    .growth-positive { color: #34D399; font-weight: 600; }
    .growth-negative { color: #F87171; font-weight: 600; }

    /* ── Stats Bar ────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 1.5rem;
      padding: 0.9rem 1.5rem;
      background: rgba(15,30,46,0.7);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat-item.pink .stat-value { color: var(--pink-light); }

    /* ── Empty State ──────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h3 { font-size: 1rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .empty-state p { font-size: 0.82rem; }

    /* ── Notification Toast ───────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;

<body>
  <!-- ── Header ── -->
  <header class="app-header">

        <div>Propellic</div>

      </div>

  </header>

  <!-- ── Progress Bar ── -->
  <nav class="progress-bar" id="progress-bar">
    <div class="progress-step active" id="ps-1">
      <span class="step-num">1</span> Client Setup
    </div>
    <span class="step-arrow">›</span>
    <div class="progress-step" id="ps-2">
      <span class="step-num">2</span> Upload Documents
    </div>
    <span class="step-arrow">›</span>
    <div class="progress-step" id="ps-3">
      <span class="step-num">3</span> Editorial Calendar
    </div>
  </nav>

  <!-- ── App Shell ── -->
  <div id="app"></div>

  <script>
  /* ════════════════════════════════════════════════════
     STATE
  ════════════════════════════════════════════════════ */
  const state = {
    step: 1,
    client: {
      name: '', url: '', industry: '', startMonth: '', numMonths: 6, contentPerMonth: 2
    },
    files: { personas: null, keywords: null, contentAnalysis: null, wqa: null, ahrefs: null },
    parsed: { personas: [], keywords: [], contentAnalysis: [], wqa: [], ahrefs: [] },
    calendar: [],
    filter: { month: 'all', status: 'all', type: 'all', funnel: 'all' }
  };

  /* ════════════════════════════════════════════════════
     UTILITIES
  ════════════════════════════════════════════════════ */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }

  function normalizeUrl(url = '') {
    return url.replace(/^https?:\/\//, '').replace(/\/$/, '').toLowerCase().trim();
  }

  function fmtVol(n) {
    if (!n && n !== 0) return '—';
    const v = parseInt(n);
    if (isNaN(v)) return '—';
    if (v >= 1000) return (v/1000).toFixed(1).replace('.0','') + 'k';
    return v.toString();
  }

  function fmtPct(n) {
    if (!n && n !== 0) return '—';
    const v = parseFloat(n);
    if (isNaN(v)) return '—';
    return (v > 0 ? '+' : '') + v.toFixed(0) + '%';
  }

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function getMonthRange(startMonthStr, n) {
    if (!startMonthStr) {
      const now = new Date();
      startMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    }
    const [yr, mo] = startMonthStr.split('-').map(Number);
    const result = [];
    for (let i = 0; i < n; i++) {
      const d = new Date(yr, mo - 1 + i, 1);
      result.push(`${MONTHS[d.getMonth()]} ${d.getFullYear()}`);
    }
    return result;
  }

  function toast(msg, duration = 3000) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  /* ════════════════════════════════════════════════════
     CSV PARSING  — smart column detection
  ════════════════════════════════════════════════════ */

  // Exact-first matching: prevents "Keyword Difficulty" stealing the keyword column
  function detectCol(headers, patterns) {
    const lower = headers.map(h => (h||'').toLowerCase().trim().replace(/['"]/g,''));

    // Pass 1: exact match
    for (const p of patterns) {
      const i = lower.indexOf(p);
      if (i !== -1) return i;
    }
    // Pass 2: header starts with pattern (e.g. "volume (us)" → "volume")
    for (const p of patterns) {
      const esc = p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const i = lower.findIndex(h => new RegExp('^' + esc + '(\\s|[^a-z]|$)').test(h));
      if (i !== -1) return i;
    }
    // Pass 3: pattern appears as whole word(s) anywhere (only for patterns ≥ 4 chars)
    for (const p of patterns) {
      if (p.length < 4) continue;
      const esc = p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const i = lower.findIndex(h => new RegExp('(^|\\s)' + esc + '(\\s|$)').test(h));
      if (i !== -1) return i;
    }
    // Pass 4: loose contains for long patterns only (≥ 6 chars)
    for (const p of patterns) {
      if (p.length < 6) continue;
      const i = lower.findIndex(h => h.includes(p));
      if (i !== -1) return i;
    }
    return -1;
  }

  // Strip commas, currency symbols, % from numeric strings like "1,200" or "$45.00"
  function cleanNum(str) {
    if (str === null || str === undefined || str === '') return null;
    const cleaned = String(str).replace(/[,$€£¥\s%"']/g,'').trim();
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }

  /* Scan the first 10 rows and pick the one that looks most like a header row
     by counting how many cells match any of the known header tokens. Real headers
     beat section titles ("ORGANIC OPPORTUNITY ANALYSIS") and source labels
     ("SEM Rush, GSC, Manual") because they contain more recognized column names. */
  function findHeaderRow(data, tokens) {
    const tok = tokens.map(t => t.toLowerCase());
    let bestIdx = 0, bestScore = -1;
    const limit = Math.min(10, data.length);
    for (let i = 0; i < limit; i++) {
      const row = data[i] || [];
      const score = row.reduce((s, cell) => {
        const v = String(cell || '').toLowerCase().trim().replace(/['"]/g,'');
        if (!v) return s;
        return s + (tok.some(t => v === t || v.startsWith(t + ' ') || v.includes(' ' + t))  ? 1 : 0);
      }, 0);
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    }
    console.log(`[ECB] findHeaderRow picked row ${bestIdx} (score ${bestScore})`);
    return bestScore >= 2 ? bestIdx : 0;
  }

  function parseKeywords(csvText) {
    const { data } = Papa.parse(csvText, { skipEmptyLines: true });
    if (data.length < 2) return [];
    const headerIdx = findHeaderRow(data, [
      'keyword','priority','pillar','cluster','journey','volume','search volume',
      'monthly search volume','kd','keyword difficulty','traffic potential',
      'cpc','organic traffic','current position','current url'
    ]);
    const h = data[headerIdx];
    // Detect columns — most-specific patterns first to avoid false matches
    const kwi   = detectCol(h, ['keyword','keywords','query','search term','key phrase','term','phrase','palavra-chave','palabra clave','mot-clé','schlüsselwort']);
    const voli  = detectCol(h, ['monthly search volume','search volume','monthly volume','monthly searches','avg. monthly searches','searches','search vol','volume','vol.','vol']);
    const kdi   = detectCol(h, ['keyword difficulty','kd (us)','us kd','kd','difficulty','dificuldade','dificultad']);
    const tpi   = detectCol(h, ['traffic potential at #1','traffic potential','potential traffic','tp','tráfego potencial']);
    const growI = detectCol(h, ['growth %','12 month growth','12mo growth','growth','yoy','crescimento']);
    const foreI = detectCol(h, ['12mo forecast','12 month forecast','forecast','projected','previsão']);
    const econI = detectCol(h, ['monthly economic impact','economic impact','economic','revenue impact','value']);
    const posI  = detectCol(h, ['avg. position','avg position','average position','current position','position','rank','ranking','posição','posicion']);
    const compI = detectCol(h, ['best ranking competitor?','best ranking competitor','competitor','competition','competing url','competitor url']);

    // Fallback: if keyword col not found, use col 0 (most keyword exports put keyword first)
    let kwCol = kwi >= 0 ? kwi : 0;

    // Sanity-check: if col 0 values look numeric (would mean we hit a KD/Volume col),
    // scan all columns for the one with the most text-like (non-numeric) values.
    if (kwi < 0) {
      const sample = data.slice(1, Math.min(6, data.length));
      let bestCol = 0, bestTextScore = -1;
      for (let ci = 0; ci < h.length; ci++) {
        const textScore = sample.reduce((s, r) => {
          const v = String(r[ci] || '').trim();
          return s + (isNaN(parseFloat(v)) && v.length > 2 ? 1 : 0);
        }, 0);
        if (textScore > bestTextScore) { bestTextScore = textScore; bestCol = ci; }
      }
      kwCol = bestCol;
      console.log(`[ECB] Keyword col not found by header — value-heuristic picked col ${kwCol}`);
    }

    return data.slice(headerIdx + 1)
      .filter(r => r[kwCol] && String(r[kwCol]).trim().length > 0)
      .map(r => ({
        keyword:         String(r[kwCol] || '').trim(),
        volume:          cleanNum(voli  >= 0 ? r[voli]  : null) ?? 0,
        kd:              cleanNum(kdi   >= 0 ? r[kdi]   : null) ?? 50,
        trafficPotential:cleanNum(tpi   >= 0 ? r[tpi]   : null) ?? 0,
        growth:          cleanNum(growI >= 0 ? r[growI] : null) ?? 0,
        forecast:        cleanNum(foreI >= 0 ? r[foreI] : null) ?? 0,
        economic:        cleanNum(econI >= 0 ? r[econI] : null) ?? 0,
        currentPosition: cleanNum(posI  >= 0 ? r[posI]  : null) ?? 0,
        competitor:      compI >= 0 ? String(r[compI]||'').trim() : ''
      }));
  }

  function parseWQA(csvText) {
    const { data } = Papa.parse(csvText, { skipEmptyLines: true });
    if (data.length < 2) return [];
    const headerIdx = findHeaderRow(data, [
      'url','final url','page path','main kw','impressions','sessions',
      'word count','status code','category','page depth','in sitemap?'
    ]);
    const h = data[headerIdx];
    // Prefer Final URL (canonical) over raw URL when both exist
    let urli = detectCol(h, ['final url','url','page url','address','page','landing page','full url','top pages','pages','path']);
    const impi = detectCol(h, ['impressions','total impressions','impression']);
    const sesi = detectCol(h, ['sessions','visits','clicks','total clicks','organic sessions','organic clicks']);
    const bki  = detectCol(h, ['referring domains','backlinks','total backlinks','links','rd']);
    const posi = detectCol(h, ['ranking','avg. position','avg position','average position','position','rank']);
    const wci  = detectCol(h, ['word count','words','wordcount','word_count']);
    const kwi  = detectCol(h, ['main kw','top keyword','primary keyword','target keyword','keyword','main keyword','top query','"best"  kw','"best" kw','best kw']);

    // If header detection failed, scan the first data rows to find the column whose
    // values look most like URLs (contain '/' or '.') — handles non-English headers.
    if (urli < 0) {
      const sample = data.slice(headerIdx + 1, Math.min(headerIdx + 6, data.length));
      let bestCol = 0, bestScore = -1;
      for (let ci = 0; ci < h.length; ci++) {
        const score = sample.reduce((s, r) => {
          const v = String(r[ci] || '');
          return s + (v.includes('/') ? 2 : 0) + (v.includes('.') ? 1 : 0) + (v.startsWith('http') ? 3 : 0);
        }, 0);
        if (score > bestScore) { bestScore = score; bestCol = ci; }
      }
      urli = bestScore > 0 ? bestCol : 0;
      console.log(`[ECB] WQA URL col not found by header — value-heuristic picked col ${urli} (score ${bestScore})`);
    }

    const urlCol = urli;

    return data.slice(headerIdx + 1)
      .filter(r => r[urlCol] && String(r[urlCol]).trim().length > 0)
      .map(r => ({
        url:         String(r[urlCol] || '').trim(),
        impressions: cleanNum(impi >= 0 ? r[impi] : null) ?? 0,
        sessions:    cleanNum(sesi >= 0 ? r[sesi] : null) ?? 0,
        backlinks:   cleanNum(bki  >= 0 ? r[bki]  : null) ?? 0,
        position:    cleanNum(posi >= 0 ? r[posi] : null) ?? 100,
        wordCount:   cleanNum(wci  >= 0 ? r[wci]  : null) ?? 0,
        topKeyword:  kwi >= 0 ? String(r[kwi]||'').trim() : ''
      }));
  }

  function parseContentAnalysis(csvText) {
    const { data } = Papa.parse(csvText, { skipEmptyLines: true });
    if (data.length < 2) return [];
    const headerIdx = findHeaderRow(data, ['url','final url','sections','target keyword','next step','page path']);
    const h = data[headerIdx];
    // Prefer Final URL over URL when both present
    const urli = detectCol(h, ['final url','url','page url','address','page','landing page']);
    const urlCol = urli >= 0 ? urli : 0;
    return data.slice(headerIdx + 1)
      .filter(r => r[urlCol] && String(r[urlCol]).trim().length > 0)
      .map(r => ({ url: String(r[urlCol] || '').trim() }));
  }

  function parsePersonas(csvText) {
    const { data } = Papa.parse(csvText, { skipEmptyLines: true });
    if (data.length < 2) return [];
    const headerIdx = findHeaderRow(data, ['persona','persona name','segment','name','audience','jtbd','job to be done','search pattern']);
    const h = data[headerIdx];
    const namei  = detectCol(h, ['persona name','persona','segment','name','audience']);
    const jtbdi  = detectCol(h, ['job to be done','jtbd','goal','objective','need','pain point']);
    const searchi= detectCol(h, ['search pattern','search queries','search keywords','searches','query','keywords']);
    const nameCol = namei >= 0 ? namei : 0;
    return data.slice(headerIdx + 1)
      .filter(r => r[nameCol] && String(r[nameCol]).trim().length > 0)
      .map(r => ({
        name:   String(r[nameCol] || '').trim(),
        jtbd:   jtbdi  >= 0 ? String(r[jtbdi]  || '').trim() : '',
        search: searchi >= 0 ? String(r[searchi]|| '').trim() : ''
      }));
  }

  function parseAhrefs(csvText) {
    const { data } = Papa.parse(csvText, { skipEmptyLines: true });
    if (data.length < 2) return [];
    const headerIdx = findHeaderRow(data, ['keyword','volume','kd','keyword difficulty','traffic potential','cpc','current position']);
    const h = data[headerIdx];
    const kwi   = detectCol(h, ['keyword','query','search term']);
    const kdi   = detectCol(h, ['keyword difficulty','kd (us)','us kd','kd','difficulty']);
    const voli  = detectCol(h, ['volume','search volume','us volume']);
    const tpi   = detectCol(h, ['traffic potential','tp']);
    const growI = detectCol(h, ['growth %','12mo growth','growth']);
    const foreI = detectCol(h, ['12mo forecast','forecast']);
    const kwCol = kwi >= 0 ? kwi : 0;
    return data.slice(headerIdx + 1)
      .filter(r => r[kwCol] && String(r[kwCol]).trim().length > 0)
      .map(r => ({
        keyword:          String(r[kwCol] || '').trim(),
        kd:               cleanNum(kdi   >= 0 ? r[kdi]   : null) ?? 50,
        volume:           cleanNum(voli  >= 0 ? r[voli]  : null) ?? 0,
        trafficPotential: cleanNum(tpi   >= 0 ? r[tpi]   : null) ?? 0,
        growth:           cleanNum(growI >= 0 ? r[growI] : null) ?? 0,
        forecast:         cleanNum(foreI >= 0 ? r[foreI] : null) ?? 0
      }));
  }

  /* ════════════════════════════════════════════════════
     PRIORITIZATION ENGINE
  ════════════════════════════════════════════════════ */
  const SEASON_SIGNALS = {
    jan:['january','jan ','winter travel','new year'],
    feb:['february','feb ','valentines','valentine'],
    mar:['march','mar ','spring break','spring travel'],
    apr:['april','apr ','easter','spring'],
    may:['may travel','may ','mothers day'],
    jun:['june','jun ','summer travel','summer trip'],
    jul:['july','jul ','fourth of july','summer vacation'],
    aug:['august','aug ','back to school'],
    sep:['september','sep ','fall travel','autumn travel'],
    oct:['october','oct ','fall foliage','halloween'],
    nov:['november','nov ','thanksgiving','holiday travel'],
    dec:['december','dec ','christmas','holiday','new years eve']
  };

  function detectSeasonality(keyword) {
    const kl = keyword.toLowerCase();
    for (const [mon, signals] of Object.entries(SEASON_SIGNALS)) {
      if (signals.some(s => kl.includes(s))) return mon;
    }
    return null;
  }

  const MONTH_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  function seasonalPublishMonth(peakMon, startMonthStr, numMonths) {
    if (!peakMon) return null;
    const [yr, mo] = (startMonthStr || '2025-01').split('-').map(Number);
    const peakIdx = MONTH_IDX[peakMon];
    // Publish 2–3 months before peak
    const publishIdx = (peakIdx - 3 + 12) % 12;
    // Find which calendar slot this falls into
    for (let i = 0; i < numMonths; i++) {
      const d = new Date(yr, mo - 1 + i, 1);
      if (d.getMonth() === publishIdx) return i;
    }
    return null;
  }

  function inferFunnel(keyword) {
    const kl = keyword.toLowerCase();
    const bofu = ['best','vs','compare','review','buy','book','cost','price','cheap','deal','hire','agency','service'];
    const mofu = ['how to','guide','tips','ideas','plan','itinerary','things to do','what to','when to','places'];
    if (bofu.some(t => kl.includes(t))) return { stage:'BOFU', sub:'Decision' };
    if (mofu.some(t => kl.includes(t))) return { stage:'MOFU', sub:'Consideration' };
    return { stage:'TOFU', sub:'Awareness' };
  }

  function inferDeliverable(type, kw, vol) {
    if (type === 'refresh') return 'Content Refresh';
    const kl = (kw||'').toLowerCase();
    if (kl.includes(' vs ') || kl.includes('compare')) return 'Comparison Guide (~2,000 words)';
    if (kl.includes('guide') || kl.includes('how to')) return 'Pillar Guide (~3,000 words)';
    if (kl.includes('itinerary') || kl.includes('trip')) return 'Itinerary Post (~2,500 words)';
    if (kl.includes('best ')) return 'Listicle / Best-Of (~2,000 words)';
    if (kl.includes('what is') || kl.includes('is ') || kl.includes('are ')) return 'FAQ Explainer (~1,200 words)';
    if (vol > 10000) return 'New Pillar Post (~3,000 words)';
    return 'New Utility Post (~1,500 words)';
  }

  function inferPainPoint(keyword, personas) {
    const kl = keyword.toLowerCase();
    if (personas.length > 0) {
      for (const p of personas) {
        if (p.search && kl.split(' ').some(w => p.search.toLowerCase().includes(w))) {
          return p.jtbd || 'Persona: ' + p.name;
        }
      }
    }
    if (kl.includes('best')) return 'Finding top-quality options';
    if (kl.includes('cost') || kl.includes('price')) return 'Budget planning & transparency';
    if (kl.includes('guide') || kl.includes('how')) return 'Research & planning confidence';
    if (kl.includes('itinerary')) return 'Trip planning structure';
    if (kl.includes('safe') || kl.includes('tips')) return 'Risk reduction & travel safety';
    return 'Information discovery';
  }

  function scoreNewContent(kw) {
    const vol = parseFloat(kw.volume) || 0;
    const kd  = parseFloat(kw.kd) || 50;
    const tp  = parseFloat(kw.trafficPotential) || 0;
    const gr  = parseFloat(kw.growth) || 0;
    const base = (vol / 100) * Math.max(0, (100 - kd) / 100);
    const tpBonus = tp / 200;
    const growthBonus = gr > 0 ? gr * 3 : 0;
    return base + tpBonus + growthBonus;
  }

  function scoreRefresh(url) {
    const imp  = parseFloat(url.impressions) || 0;
    const ses  = parseFloat(url.sessions)    || 0;
    const pos  = parseFloat(url.position)    || 100;
    const bl   = parseFloat(url.backlinks)   || 0;
    const gap = ses > 0 ? (imp / ses) : imp / 5;
    const strikingBonus = (pos >= 11 && pos <= 20) ? 6000 : 0;
    const blBonus = bl * 80;
    const negForecastPenalty = 0; // flag but don't fully penalize
    return gap + strikingBonus + blBonus - negForecastPenalty;
  }

  function hasCannibalizing(keyword, allUrls) {
    const words = keyword.toLowerCase().split(/\s+/).filter(w => w.length > 3);
    if (words.length === 0) return false;
    return allUrls.some(url => {
      const slug = url.toLowerCase().replace(/[-_/]/g,' ');
      return words.filter(w => slug.includes(w)).length >= Math.ceil(words.length * 0.7);
    });
  }

  function buildRationale(opp, slotIdx, seasonMon) {
    if (opp.type === 'refresh') {
      const pos = opp.position;
      const gap = opp.sessions > 0 ? Math.round(opp.impressions / opp.sessions) : 0;
      if (pos >= 11 && pos <= 20) {
        return `METRIC: Striking-distance pos ${pos} — refresh to break page 1 threshold and capture high-intent traffic.`;
      }
      if (gap > 20) {
        return `METRIC: ${gap}:1 impression-to-click gap signals H1/title misalignment. Refresh meta + intro to unlock latent sessions.`;
      }
      if (opp.backlinks > 5) {
        return `METRIC: ${opp.backlinks} backlinks = link equity worth protecting. Refresh to prevent decay and improve E-E-A-T signals.`;
      }
      return `METRIC: Underperforming page with measurable gap between impressions and sessions — high-ROI refresh target.`;
    }
    if (seasonMon !== null) {
      const peakMonth = MONTHS[MONTH_IDX[detectSeasonality(opp.keyword)] ?? 0];
      return `SEASONALITY: Publish ${Math.abs(slotIdx - seasonMon)} months ahead of ${peakMonth} peak. Google needs crawl time to rank before intent surge.`;
    }
    const kd = parseFloat(opp.kd) || 50;
    const vol = parseInt(opp.volume) || 0;
    if (kd < 30) return `METRIC: Low KD (${kd}) + ${fmtVol(vol)}/mo volume = fastest path to organic wins. Anchor piece for topical cluster.`;
    if (opp.growth > 20) return `METRIC: +${opp.growth}% growth trend — capture window is now. Negative-forecast lock-in risk if delayed.`;
    return `STRATEGY: Fills identified keyword gap where competitors rank but client does not. Supports cluster authority building.`;
  }

  function titleCase(str) {
    return (str || '').trim().replace(/\b\w/g, c => c.toUpperCase());
  }

  // Derive a readable keyword label from a URL slug when no topKeyword is available
  function slugToKeyword(url) {
    return (url || '')
      .split('/').filter(Boolean).pop()
      ?.replace(/[-_]/g, ' ')
      .replace(/\.\w+$/, '')   // strip file extension
      .trim() || url;
  }

  function generateCalendar() {
    const { keywords, wqa, contentAnalysis, personas, ahrefs } = state.parsed;
    const { startMonth, numMonths, contentPerMonth } = state.client;
    const months     = getMonthRange(startMonth, numMonths);
    const totalSlots = numMonths * contentPerMonth;

    console.log('[ECB] generateCalendar start', {
      keywords: keywords.length, wqa: wqa.length,
      contentAnalysis: contentAnalysis.length, ahrefs: ahrefs.length,
      numMonths, contentPerMonth, startMonth
    });

    /* ── 1. Merge Ahrefs enrichment into keyword gap data ── */
    const mergedKeywords = keywords.map(kw => {
      const ah = ahrefs.find(a => a.keyword.toLowerCase() === kw.keyword.toLowerCase());
      if (!ah) return kw;
      return {
        ...kw,
        kd:              ah.kd              ?? kw.kd,
        volume:          ah.volume          || kw.volume,
        trafficPotential:ah.trafficPotential|| kw.trafficPotential,
        growth:          ah.growth          ?? kw.growth,
        forecast:        ah.forecast        ?? kw.forecast
      };
    });

    /* ── 2. Build keyword lookup so refresh rows can inherit metrics ── */
    const kwLookup = new Map();
    mergedKeywords.forEach(kw => {
      if (kw.keyword) kwLookup.set(kw.keyword.toLowerCase(), kw);
    });

    const offLimits = new Set(contentAnalysis.map(r => normalizeUrl(r.url)));

    /* ── 3. Score new-content opportunities ──
       NOTE: We intentionally do NOT filter by hasCannibalizing here.
       Keyword gap CSVs already represent terms the client doesn't rank for;
       false-positive overlap with URL slugs was silently eliminating all candidates.
    ── */
    const newOpps = mergedKeywords
      .filter(kw => kw.keyword && kw.keyword.length > 1)
      .map(kw => ({
        type: 'new', ...kw,
        score:     scoreNewContent(kw),
        seasonMon: detectSeasonality(kw.keyword)
      }))
      .sort((a, b) => b.score - a.score);

    console.log('[ECB] newOpps after filter:', newOpps.length,
      newOpps.slice(0,3).map(o => o.keyword));

    /* ── 4. Score refresh opportunities & cross-reference keyword metrics ── */
    const refreshOpps = wqa
      .filter(u => !offLimits.has(normalizeUrl(u.url)))
      .filter(u => u.url && u.url.length > 0)
      .map(u => {
        // Prefer topKeyword from WQA; fall back to readable URL slug
        const targetKw = (u.topKeyword && u.topKeyword.length > 0)
          ? u.topKeyword
          : slugToKeyword(u.url);

        // Cross-reference keyword data so refresh rows carry KD/Volume/TP/Growth/Forecast
        const kwData = kwLookup.get(targetKw.toLowerCase());

        return {
          type:            'refresh',
          ...u,
          keyword:         targetKw,
          score:           scoreRefresh(u),
          // Keyword metrics from cross-reference (undefined if no match — show blank, not 0)
          kd:              kwData?.kd,
          volume:          kwData?.volume,
          trafficPotential:kwData?.trafficPotential,
          growth:          kwData?.growth,
          forecast:        kwData?.forecast
        };
      })
      .sort((a, b) => b.score - a.score);

    console.log('[ECB] refreshOpps after filter:', refreshOpps.length,
      refreshOpps.slice(0,3).map(o => o.url));

    if (newOpps.length === 0 && refreshOpps.length === 0) {
      console.warn('[ECB] Both opportunity pools are empty — calendar will be blank. ' +
        'Check that keyword/WQA CSVs have the correct column headers.');
    }

    /* ── 5. Pre-assign seasonal new-content keywords to target month slots ── */
    const seasonalAssignments = new Map(); // month index → newOpps index
    newOpps.forEach((opp, i) => {
      if (!opp.seasonMon) return;
      const slot = seasonalPublishMonth(opp.seasonMon, startMonth, numMonths);
      if (slot !== null && !seasonalAssignments.has(slot)) {
        seasonalAssignments.set(slot, i);
      }
    });

    /* ── 6. Balanced calendar assembly: anchor + complement per month ──
       Phase 2 rule: pair one anchor (highest-leverage) + one complement
       (prefers opposite type or different funnel stage) each month.
       This prevents refresh opps from monopolising all slots.
    ── */
    const usedOpps = new Set();
    const calendar  = [];
    let   priority  = 1;

    function pickUnused(pool) {
      return pool.find(o => !usedOpps.has(o)) || null;
    }

    for (let mi = 0; mi < numMonths; mi++) {
      const month    = months[mi];
      const monthBuf = [];

      for (let pi = 0; pi < contentPerMonth; pi++) {
        let opp = null;

        if (pi === 0) {
          /* Anchor slot — seasonal keyword takes priority; otherwise highest-scoring overall */
          if (seasonalAssignments.has(mi)) {
            const si = seasonalAssignments.get(mi);
            if (!usedOpps.has(newOpps[si])) opp = newOpps[si];
          }
          if (!opp) {
            const topNew = pickUnused(newOpps);
            const topRef = pickUnused(refreshOpps);
            if (topNew && topRef) opp = topNew.score >= topRef.score ? topNew : topRef;
            else                  opp = topNew || topRef;
          }
        } else {
          /* Complement slot — prefer opposite type to anchor; then different funnel stage */
          const anchorType = monthBuf[0]?.type;
          if (anchorType === 'refresh') {
            opp = pickUnused(newOpps) || pickUnused(refreshOpps);
          } else {
            opp = pickUnused(refreshOpps) || pickUnused(newOpps);
          }
        }

        if (!opp) break;
        usedOpps.add(opp);
        monthBuf.push(opp);
      }

      /* Push assembled month rows to calendar */
      for (const opp of monthBuf) {
        const seasonMon = opp.seasonMon ? (MONTH_IDX[opp.seasonMon] ?? null) : null;
        const funnel    = inferFunnel(opp.keyword);
        const isRefresh = opp.type === 'refresh';

        calendar.push({
          id:               uid(),
          priority:         priority++,
          month,
          contentType:      isRefresh ? 'Content Refresh' : 'Content Outline',
          status:           'Topic Proposed',
          // Live URL is where the content will go live once published — blank & editable
          liveUrl:          '',
          funnelStage:      funnel.stage,
          funnelSub:        funnel.sub,
          topic:            isRefresh
                              ? `Refresh: ${titleCase(opp.keyword)}`
                              : titleCase(opp.keyword),
          targetKeyword:    opp.keyword,
          // Use ?? so numeric 0 is preserved; undefined → '' (truly unknown)
          kd:               opp.kd              ?? '',
          volume:           opp.volume           ?? '',
          currentPosition:  isRefresh ? (opp.position ?? '') : (opp.currentPosition ?? ''),
          painPoint:        inferPainPoint(opp.keyword, personas),
          trafficPotential: opp.trafficPotential ?? '',
          growth12mo:       opp.growth           ?? '',
          forecast12mo:     opp.forecast          ?? '',
          deliverableType:  inferDeliverable(opp.type, opp.keyword, opp.volume),
          rationale:        buildRationale(opp, seasonalAssignments.has(mi) ? mi : null, seasonMon),
          // Preserve refresh-source URL in notes (Live URL is for published content)
          notes:            isRefresh
                              ? `Source: ${opp.url || '—'} | Impressions: ${fmtVol(opp.impressions)} | Sessions: ${fmtVol(opp.sessions)} | Backlinks: ${opp.backlinks}`
                              : 'Internal link to: [update with existing URLs]'
        });
      }
    }

    /* ── 7. Pad any remaining slots ── */
    const padMonths = getMonthRange(startMonth, numMonths);
    while (calendar.length < totalSlots) {
      const mIdx = Math.floor(calendar.length / contentPerMonth);
      calendar.push({
        id: uid(), priority: priority++,
        month: padMonths[mIdx] || padMonths[padMonths.length - 1],
        contentType: 'Content Outline', status: 'Topic Proposed', liveUrl: '',
        funnelStage: 'TOFU', funnelSub: 'Awareness',
        topic: '', targetKeyword: '', kd: '', volume: '', currentPosition: '',
        painPoint: '', trafficPotential: '', growth12mo: '', forecast12mo: '',
        deliverableType: 'New Utility Post (~1,500 words)',
        rationale: 'STRATEGY: ', notes: ''
      });
    }

    return calendar;
  }

  function statusBadgeHtml(status) {

  function funnelBadgeHtml(stage, sub) {
    const cls = stage==='TOFU'?'f-tofu': stage==='MOFU'?'f-mofu':'f-bofu';
    return `<div class="funnel-badge"><span class="funnel-stage ${cls}">${stage}</span><span class="funnel-sub">${escapeHtml(sub||'')}</span></div>`;
  }

  function typeBadgeHtml(type) {
    const map = { 'Content Outline':'t-outline', 'Content Refresh':'t-refresh', 'AI Generated Content':'t-ai' };
    const icons = { 'Content Outline':'📝', 'Content Refresh':'🔄', 'AI Generated Content':'✨' };
    return `<span class="type-badge ${map[type]||'t-outline'}">${icons[type]||'📝'} ${escapeHtml(type)}</span>`;
  }

  function rationaleTagHtml(text) {
    const t = text || '';
    if (t.startsWith('SEASONALITY')) return `<span class="rationale-tag r-seasonality">SEASONALITY</span>${escapeHtml(t.replace(/^SEASONALITY:\s*/,''))}`;
    if (t.startsWith('METRIC'))      return `<span class="rationale-tag r-metric">METRIC</span>${escapeHtml(t.replace(/^METRIC:\s*/,''))}`;
    if (t.startsWith('STRATEGY'))    return `<span class="rationale-tag r-strategy">STRATEGY</span>${escapeHtml(t.replace(/^STRATEGY:\s*/,''))}`;
    return escapeHtml(t);
  }

  function kdChip(kd) {
    if (!kd && kd !== 0) return '—';
    const n = parseInt(kd);
    if (isNaN(n)) return escapeHtml(String(kd));
    const cls = n < 30 ? 'kd-low' : n < 60 ? 'kd-mid' : 'kd-high';
    return `<span class="kd-chip ${cls}">${n}</span>`;
  }

  function growthHtml(val) {
    if (!val && val !== 0) return '—';
    const n = parseFloat(val);
    if (isNaN(n)) return '—';
    const cls = n >= 0 ? 'growth-positive' : 'growth-negative';
    return `<span class="${cls}">${n>0?'+':''}${n.toFixed(0)}%</span>`;
  }

      : `<div class="table-scroll-wrapper">
          <table class="cal-table">
            <thead><tr>
              <th class="col-priority">#</th>
              <th class="col-month">Month</th>
              <th class="col-type">Content Type</th>
              <th class="col-status">Status</th>
              <th class="col-url">Live URL</th>
              <th class="col-funnel">Funnel</th>
              <th class="col-topic">Topic (H1)</th>
              <th class="col-kw">Target Keyword</th>
              <th class="col-kd">KD</th>
              <th class="col-volume">Volume</th>
              <th class="col-position">Position</th>
              <th class="col-pain">Pain Point</th>
              <th class="col-tp">Traffic Pot.</th>
              <th class="col-growth">Growth 12mo</th>
              <th class="col-forecast">Forecast</th>
              <th class="col-deliverable">Deliverable</th>
              <th class="col-rationale">Priority Rationale</th>
              <th class="col-notes">Notes</th>
              <th class="col-actions"></th>
            </tr></thead>
            <tbody id="cal-tbody">
              ${cal.map(row => renderRow(row)).join('')}
              <tr class="add-row-tr">
                <td colspan="19">
                  <button class="add-row-btn" onclick="handleAddRow()">+ Add Row</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>`;

    return `
    <div class="page-content wide">
      <div class="stats-bar">
        <div class="stat-item pink">
          <div class="stat-value">${all.length}</div>
          <div class="stat-label">Total Pieces</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${newCount}</div>
          <div class="stat-label">Net New</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${refreshCount}</div>
          <div class="stat-label">Refreshes</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${fmtVol(totalVol)}</div>
          <div class="stat-label">Total Keyword Vol</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${publishedCount}</div>
          <div class="stat-label">Published</div>
        </div>
        <div style="flex:1"></div>
        <button class="btn btn-ghost btn-sm" onclick="goToStep(2)">← Edit Inputs</button>
      </div>

      <div class="cal-toolbar">
        <div class="left">
          <select class="cal-filter-select" onchange="state.filter.month=this.value||'all';renderApp()" id="fil-month">
            <option value="all">All Months</option>
            ${uniqueMonths.map(m=>`<option value="${m}" ${state.filter.month===m?'selected':''}>${m}</option>`).join('')}
          </select>
          <select class="cal-filter-select" onchange="state.filter.status=this.value||'all';renderApp()" id="fil-status">
            <option value="all">All Statuses</option>
            ${statuses.map(s=>`<option value="${s}" ${state.filter.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <select class="cal-filter-select" onchange="state.filter.type=this.value||'all';renderApp()" id="fil-type">
            <option value="all">All Types</option>
            ${contentTypes.map(t=>`<option value="${t}" ${state.filter.type===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <select class="cal-filter-select" onchange="state.filter.funnel=this.value||'all';renderApp()" id="fil-funnel">
            <option value="all">All Funnel Stages</option>
            ${funnelStages.map(f=>`<option value="${f}" ${state.filter.funnel===f?'selected':''}>${f}</option>`).join('')}
          </select>
          <span class="cal-count">${cal.length} of ${all.length} rows</span>
        </div>
        <div class="right">
          <button class="btn btn-secondary btn-sm" onclick="handleExportCSV()">↓ CSV</button>
          <button class="btn btn-secondary btn-sm" onclick="handleExportJSON()">↓ JSON</button>
          <button class="btn btn-primary btn-sm" onclick="handleAddRow()">+ Add Row</button>
        </div>
      </div>

      ${tableHtml}
    </div>`;
  }

  function filteredCalendar() {
    return state.calendar.filter(r => {
      const { month, status, type, funnel } = state.filter;
      return (month  === 'all' || r.month        === month)
          && (status === 'all' || r.status        === status)
          && (type   === 'all' || r.contentType   === type)
          && (funnel === 'all' || r.funnelStage   === funnel);
    });
  }

  /* ════════════════════════════════════════════════════
     RENDER ROW
  ════════════════════════════════════════════════════ */
  function renderRow(row) {
    const {id} = row;
    const statuses     = ['Topic Proposed','Topic Approved','Topic Rejected','Outline in Progress','Writing in Progress','Content Review','Content Published'];
    const contentTypes = ['Content Outline','Content Refresh','AI Generated Content'];
    const funnelStages = ['TOFU','MOFU','BOFU'];
    const funnelSubs   = { TOFU:['Awareness','Interest'], MOFU:['Consideration','Intent'], BOFU:['Decision','Conversion'] };
    const months       = getMonthRange(state.client.startMonth, state.client.numMonths);

    return `<tr data-row-id="${id}">
      <td class="col-priority"><span class="priority-num">${row.priority}</span></td>

      <td class="col-month">
        <select class="cell-select" onchange="updateRow('${id}','month',this.value)">
          ${months.map(m=>`<option value="${m}" ${row.month===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </td>

      <td class="col-type">
        <select class="cell-select" onchange="updateRow('${id}','contentType',this.value)">
          ${contentTypes.map(t=>`<option value="${t}" ${row.contentType===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </td>

      <td class="col-status">
        <select class="cell-select" onchange="updateRow('${id}','status',this.value)">
          ${statuses.map(s=>`<option value="${s}" ${row.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>

      <td class="col-url">
        <span class="editable" contenteditable="true"
          data-placeholder="Paste URL when published"
          onblur="updateRow('${id}','liveUrl',this.textContent.trim())"
          data-field="liveUrl">${escapeHtml(row.liveUrl || '')}</span>
      </td>

      <td class="col-funnel">
        <select class="cell-select" onchange="updateFunnel('${id}',this.value)">
          ${funnelStages.map(f=>`<option value="${f}" ${row.funnelStage===f?'selected':''}>${f}</option>`).join('')}
        </select>
        <select class="cell-select" style="margin-top:3px" onchange="updateRow('${id}','funnelSub',this.value)">
          ${(funnelSubs[row.funnelStage]||['Awareness']).map(s=>`<option value="${s}" ${row.funnelSub===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>

      <td class="col-topic">
        <span class="editable" contenteditable="true"
          onblur="updateRow('${id}','topic',this.textContent.trim())">${escapeHtml(row.topic)}</span>
      </td>

      <td class="col-kw">
        <span class="editable" contenteditable="true"
          onblur="updateRow('${id}','targetKeyword',this.textContent.trim())">${escapeHtml(row.targetKeyword)}</span>
      </td>

      <td class="col-kd" style="text-align:center">
        <span class="editable" contenteditable="true" style="text-align:center"
          onblur="updateRow('${id}','kd',this.textContent.trim())">${kdChip(row.kd)}</span>
      </td>

      <td class="col-volume" style="text-align:right">
        <span class="editable" contenteditable="true" style="text-align:right"
          onblur="updateRow('${id}','volume',this.textContent.trim())">${fmtVol(row.volume)}</span>
      </td>

      <td class="col-position" style="text-align:center">
        <span class="editable" contenteditable="true" style="text-align:center"
          onblur="updateRow('${id}','currentPosition',this.textContent.trim())">${escapeHtml(String(row.currentPosition||'—'))}</span>
      </td>

      <td class="col-pain">
        <span class="editable" contenteditable="true"
          onblur="updateRow('${id}','painPoint',this.textContent.trim())">${escapeHtml(row.painPoint)}</span>
      </td>

      <td class="col-tp" style="text-align:right">
        <span class="editable" contenteditable="true" style="text-align:right"
          onblur="updateRow('${id}','trafficPotential',this.textContent.trim())">${fmtVol(row.trafficPotential)}</span>
      </td>

      <td class="col-growth" style="text-align:right">
        <span class="editable" contenteditable="true" style="text-align:right"
          onblur="updateRow('${id}','growth12mo',this.textContent.trim())">${growthHtml(row.growth12mo)}</span>
      </td>

      <td class="col-forecast" style="text-align:right">
        <span class="editable" contenteditable="true" style="text-align:right"
          onblur="updateRow('${id}','forecast12mo',this.textContent.trim())">${growthHtml(row.forecast12mo)}</span>
      </td>

      <td class="col-deliverable">
        <span class="editable" contenteditable="true"
          onblur="updateRow('${id}','deliverableType',this.textContent.trim())">${escapeHtml(row.deliverableType)}</span>
      </td>

      <td class="col-rationale">
        <span class="editable" contenteditable="true" style="font-size:0.73rem;line-height:1.35"
          onblur="updateRow('${id}','rationale',this.textContent.trim())">${rationaleTagHtml(row.rationale)}</span>
      </td>

      <td class="col-notes">
        <span class="editable" contenteditable="true" style="font-size:0.73rem;line-height:1.35"
          onblur="updateRow('${id}','notes',this.textContent.trim())">${escapeHtml(row.notes)}</span>
      </td>

      <td class="col-actions">
        <button class="btn-danger" onclick="handleDeleteRow('${id}')" title="Delete row">✕</button>
      </td>
    </tr>`;
  }

  /* ════════════════════════════════════════════════════
     MAIN RENDER
  ════════════════════════════════════════════════════ */
  function renderApp() {
    const app = document.getElementById('app');

    // Update progress bar
    ['ps-1','ps-2','ps-3'].forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'progress-step' +
        (state.step === i+1 ? ' active' : state.step > i+1 ? ' done' : '');
    });

    // Update header client name
    const hc = document.getElementById('header-client');
    if (hc) hc.textContent = state.client.name
      ? `${state.client.name}  ·  ${state.client.industry}`
      : '';

    switch(state.step) {
      case 1: app.innerHTML = renderStep1(); attachStep1(); break;
      case 2: app.innerHTML = renderStep2(); break;
      case 3: app.innerHTML = renderStep3(); break;
    }

    saveState();
  }

  /* ════════════════════════════════════════════════════
     STEP 1 LIVE UPDATING
  ════════════════════════════════════════════════════ */
  function attachStep1() {
    const update = () => {
      const nm = parseInt(document.getElementById('f-months')?.value) || 6;
      const cp = parseInt(document.getElementById('f-cpp')?.value) || 2;
      const tp = document.getElementById('total-pieces');
      const tm = document.getElementById('total-months');
      if (tp) tp.textContent = nm * cp;
      if (tm) tm.textContent = nm;
    };
    document.getElementById('f-months')?.addEventListener('change', update);
    document.getElementById('f-cpp')?.addEventListener('change', update);
  }

  /* ════════════════════════════════════════════════════
     EVENT HANDLERS
  ════════════════════════════════════════════════════ */
  function goToStep(n) {
    state.step = n;
    renderApp();
    window.scrollTo(0,0);
  }

  function handleStep1Next() {
    const name = document.getElementById('f-name')?.value?.trim();
    const url  = document.getElementById('f-url')?.value?.trim();
    const start= document.getElementById('f-start')?.value;
    if (!name) { toast('Please enter the client name.'); return; }
    if (!start){ toast('Please select a starting month.'); return; }
    state.client = {
      name,
      url:             document.getElementById('f-url')?.value?.trim() || '',
      industry:        document.getElementById('f-industry')?.value || 'Travel & Tourism',
      startMonth:      start,
      numMonths:       parseInt(document.getElementById('f-months')?.value) || 6,
      contentPerMonth: parseInt(document.getElementById('f-cpp')?.value) || 2
    };
    goToStep(2);
  }

  /* Read a file as text, auto-detecting UTF-16 LE/BE and rejecting binary Office formats. */
  function readFileText(file, onText) {
    const sniff = new FileReader();
    sniff.onload = e => {
      const bytes = new Uint8Array(e.target.result);
      // Reject XLSX (PK magic 50 4B) and XLS (D0 CF magic)
      if ((bytes[0] === 0x50 && bytes[1] === 0x4B) ||
          (bytes[0] === 0xD0 && bytes[1] === 0xCF)) {
        toast('⚠ Excel (.xlsx/.xls) files are not supported. Re-export as CSV (UTF-8) from your tool.', 8000);
        onText(null);
        return;
      }
      // Detect UTF-16 BOM (FF FE = LE, FE FF = BE)
      const enc = (bytes[0] === 0xFF && bytes[1] === 0xFE) ? 'UTF-16LE'
                : (bytes[0] === 0xFE && bytes[1] === 0xFF) ? 'UTF-16BE'
                : 'UTF-8';
      const reader = new FileReader();
      reader.onload = ev => {
        let text = ev.target.result;
        // Strip byte-order mark if present
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        onText(text);
      };
      reader.readAsText(file, enc);
    };
    sniff.readAsArrayBuffer(file.slice(0, 4));
  }

  function handleFileInput(event, key) {
    const file = event.target.files[0];
    if (!file) return;
    state.files[key] = file;
    readFileText(file, text => {
      if (text === null) { state.files[key] = null; renderApp(); return; }
      parseFile(key, text);
      renderApp();
    });
  }

  function handleDragOver(event, key) {
    event.preventDefault();
    document.getElementById(`zone-${key}`)?.classList.add('drag-over');
  }

  function handleDragLeave(key) {
    document.getElementById(`zone-${key}`)?.classList.remove('drag-over');
  }

  function handleDrop(event, key) {
    event.preventDefault();
    handleDragLeave(key);
    const file = event.dataTransfer.files[0];
    if (!file) return;
    state.files[key] = file;
    readFileText(file, text => {
      if (text === null) { state.files[key] = null; renderApp(); return; }
      parseFile(key, text);
      renderApp();
    });
  }

  function parseFile(key, text) {
    const parsers = {
      keywords:        parseKeywords,
      wqa:             parseWQA,
      contentAnalysis: parseContentAnalysis,
      personas:        parsePersonas,
      ahrefs:          parseAhrefs
    };
    if (parsers[key]) {
      state.parsed[key] = parsers[key](text);
      toast(`✓ Parsed ${state.parsed[key].length} rows from ${key}`);
    }
  }

  function handleDemoData() {
    const { startMonth, numMonths, contentPerMonth } = state.client;
    state.calendar = getDemoCalendar(startMonth, numMonths, contentPerMonth);
    state.step = 3;
    renderApp();
    toast('⚡ Demo data loaded — travel industry example');
  }

  function handleGenerate() {
    const hasData = state.parsed.keywords.length > 0 || state.parsed.wqa.length > 0;
    if (!hasData) {
      handleDemoData();
      return;
    }
    // Clear any stale saved calendar before regenerating from fresh data
    state.calendar = [];
    state.calendar = generateCalendar();
    const filled = state.calendar.filter(r => r.targetKeyword && r.targetKeyword.length > 0).length;
    const padded = state.calendar.length - filled;
    goToStep(3);
    if (filled === 0) {
      toast(`⚠ Calendar generated but all rows are empty. Open browser console (F12) and look for [ECB] logs to diagnose.`, 6000);
    } else {
      toast(`✓ Generated ${filled} content items from your data${padded > 0 ? ` (${padded} placeholder rows added to reach target)` : ''}`);
    }
  }

  function handleAddRow() {
    const months = getMonthRange(state.client.startMonth, state.client.numMonths);
    const lastMonth = state.calendar.length > 0
      ? state.calendar[state.calendar.length-1].month
      : (months[0] || 'Jan 2025');
    state.calendar.push({
      id: uid(),
      priority: state.calendar.length + 1,
      month: lastMonth,
      contentType: 'Content Outline',
      status: 'Topic Proposed',
      liveUrl: '',
      funnelStage: 'TOFU', funnelSub: 'Awareness',
      topic: '', targetKeyword: '',
      kd: '', volume: '', currentPosition: '',
      painPoint: '', trafficPotential: '',
      growth12mo: '', forecast12mo: '',
      deliverableType: 'New Utility Post (~1,500 words)',
      rationale: 'STRATEGY: ',
      notes: ''
    });
    renderApp();
    // Scroll to bottom of table
    const wrapper = document.querySelector('.table-scroll-wrapper');
    if (wrapper) wrapper.scrollTop = wrapper.scrollHeight;
  }

  function handleDeleteRow(id) {
    state.calendar = state.calendar.filter(r => r.id !== id);
    // Re-number priorities
    state.calendar.forEach((r, i) => r.priority = i + 1);
    renderApp();
  }

  function updateRow(id, field, value) {
    const row = state.calendar.find(r => r.id === id);
    if (row) { row[field] = value; saveState(); }
  }

  function updateFunnel(id, stage) {
    const row = state.calendar.find(r => r.id === id);
    if (!row) return;
    row.funnelStage = stage;
    const subs = { TOFU:['Awareness','Interest'], MOFU:['Consideration','Intent'], BOFU:['Decision','Conversion'] };
    row.funnelSub = subs[stage]?.[0] || 'Awareness';
    // Re-render just this row to update sub-stage options
    const tr = document.querySelector(`tr[data-row-id="${id}"]`);
    if (tr) tr.outerHTML = renderRow(row);
    saveState();
  }

  /* ════════════════════════════════════════════════════
     EXPORT
  ════════════════════════════════════════════════════ */
  function handleExportCSV() {
    const headers = ['Priority','Month','Content Type','Status','Live URL','Funnel Stage','Funnel Sub',
      'Topic (H1)','Target Keyword','KD','Volume','Current Position','Pain Point',
      'Traffic Potential','Growth 12mo%','Forecast 12mo','Deliverable Type','Priority Rationale','Notes'];
    const rows = state.calendar.map(r => [
      r.priority, r.month, r.contentType, r.status, r.liveUrl,
      r.funnelStage, r.funnelSub, r.topic, r.targetKeyword,
      r.kd, r.volume, r.currentPosition, r.painPoint,
      r.trafficPotential, r.growth12mo, r.forecast12mo,
      r.deliverableType, r.rationale, r.notes
    ]);
    const csv = [headers, ...rows].map(r => r.map(c =>
      `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    download(csv, `${slugify(state.client.name)}-editorial-calendar.csv`, 'text/csv');
    toast('✓ CSV downloaded');
  }

  function handleExportJSON() {
    const data = {
      generatedAt: new Date().toISOString(),
      client: state.client,
      calendar: state.calendar
    };
    download(JSON.stringify(data, null, 2),
      `${slugify(state.client.name)}-editorial-calendar.json`,
      'application/json');
    toast('✓ JSON downloaded');
  }

  function download(content, filename, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function slugify(str) {
    return (str||'propellic').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'calendar';
  }

  /* ════════════════════════════════════════════════════
     LOCAL STORAGE
  ════════════════════════════════════════════════════ */
  function saveState() {
    try {
      localStorage.setItem('propellic-ecb', JSON.stringify({
        step: state.step,
        client: state.client,
        calendar: state.calendar,
        filter: state.filter
      }));
    } catch(e) { /* storage full — ignore */ }
  }

  function loadState() {
    try {
      const saved = localStorage.getItem('propellic-ecb');
      if (!saved) return;
      const s = JSON.parse(saved);
      if (s.client)   state.client   = { ...state.client,   ...s.client };
      if (s.calendar) state.calendar = s.calendar;
      if (s.filter)   state.filter   = { ...state.filter,   ...s.filter };
      if (s.step)     state.step     = s.step;
    } catch(e) { /* corrupt — ignore */ }
  }

  /* ════════════════════════════════════════════════════
     INIT
  ════════════════════════════════════════════════════ */
  loadState();
  renderApp();
  </script>
